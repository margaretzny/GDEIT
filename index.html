<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARHK Timeline — 五线时间轴</title>
<style>
  :root {
    --bg:#f6f7fb; --panel:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#cfd3da; --axis:#bcbfc7;
    --blue:#2F80ED; --green:#27AE60; --orange:#F2994A; --gray:#9CA3AF; --yellow:#E0A800; --shadow:0 8px 24px rgba(15,23,42,.08);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color:var(--text); background:var(--bg); }
  .app { display:grid; grid-template-columns: minmax(900px,1fr) 330px; gap:16px; padding:16px; }
  .board { background:var(--panel); border-radius:18px; box-shadow:var(--shadow); overflow:auto; position:relative; }
  .toolbar { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.95); backdrop-filter: blur(8px); border-bottom:1px solid #eceff4; padding:12px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .toolbar h1 { font-size:18px; margin:0 12px 0 0; }
  .toolbar button, .toolbar label.btn { border:none; background:#111827; color:#fff; padding:8px 12px; border-radius:10px; cursor:pointer; font-size:13px; }
  .toolbar button.secondary, .toolbar label.btn.secondary { background:#e5e7eb; color:#111827; }
  .toolbar .hint { color:var(--muted); font-size:12px; }
  #importFile { display:none; }
  .timeline-wrap { position:relative; padding:20px 24px 30px; min-width:1700px; }
  .months { position:relative; height:44px; border-bottom:1px solid #eef2f7; margin-bottom:16px; }
  .month-label { position:absolute; top:0; transform:translateX(-50%); font-size:12px; color:#374151; font-weight:700; white-space:nowrap; }
  .month-line { position:absolute; top:22px; bottom:0; width:1px; background:#e5e7eb; }
  .week-line { position:absolute; top:22px; bottom:0; width:1px; background:#f1f3f6; }
  .sections { position:relative; }
  .section { position:relative; height:160px; margin-bottom:6px; }
  .section-title { position:absolute; left:0; top:0; width:255px; font-weight:700; font-size:16px; color:#111827; }
  .section-sub { position:absolute; left:0; top:24px; width:255px; font-size:12px; color:#6b7280; }
  .axis { position:absolute; left:255px; right:24px; top:76px; height:10px; background:#d2d4d8; border-radius:5px; }
  .node { position:absolute; width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; font-weight:700; font-size:12px; cursor:pointer; box-shadow:0 6px 14px rgba(0,0,0,.14); z-index:6; }
  .node .inside { line-height:1.2; }
  .status-complete { background:var(--green); }
  .status-progress { background:var(--blue); }
  .status-notstart { background:#7f8a98; }
  .status-pending { background:var(--yellow); color:#fff; }
  .status-paused { background:#9C27B0; }
  .callout { position:absolute; width:160px; font-size:13px; line-height:1.35; color:#111827; z-index:6; }
  .callout .title { font-weight:700; }
  .callout .meta { color:#6b7280; font-size:12px; margin-top:3px; }
  .leader { position:absolute; width:42px; height:48px; overflow:visible; z-index:5; }
  .leader path { fill:none; stroke:#60a5fa; stroke-width:2; stroke-dasharray:6 5; }
  .pending-box { position:absolute; left:255px; right:24px; bottom:8px; min-height:32px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .pending-label { font-size:12px; color:#6b7280; margin-right:2px; }
  .pending-tag { background:#fff6db; color:#8a6700; border:1px solid #f4d88a; padding:4px 8px; border-radius:999px; font-size:12px; cursor:pointer; }
  .cross-svg { position:absolute; inset:0; pointer-events:none; z-index:2; }
  .cross-date-label { fill:#94a3b8; font-size:11px; }
  .side { background:var(--panel); border-radius:18px; box-shadow:var(--shadow); padding:16px; position:sticky; top:16px; height:calc(100vh - 32px); overflow:auto; }
  .side h2 { margin:0 0 10px; font-size:18px; }
  .side .tip { color:#6b7280; font-size:12px; margin-bottom:12px; }
  .field { margin-bottom:10px; }
  .field label { display:block; font-size:12px; color:#6b7280; margin-bottom:5px; }
  .field input, .field select, .field textarea { width:100%; border:1px solid #d9dee7; border-radius:10px; padding:9px 10px; font:inherit; }
  .field textarea { min-height:92px; resize:vertical; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .actions button { border:none; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13px; }
  .primary { background:#2563eb; color:#fff; }
  .ghost { background:#eef2ff; color:#1e3a8a; }
  .danger { background:#fee2e2; color:#991b1b; }
  .muted { background:#f3f4f6; color:#111827; }
  .legend { margin-top:18px; border-top:1px solid #edf0f5; padding-top:14px; }
  .legend-item { display:flex; align-items:center; gap:8px; font-size:12px; color:#4b5563; margin-bottom:8px; }
  .swatch { width:12px; height:12px; border-radius:50%; }
  .footer-note { margin-top:14px; font-size:12px; color:#6b7280; line-height:1.5; }
  @media (max-width: 1200px) { .app { grid-template-columns: 1fr; } .side { position:relative; top:0; height:auto; } }

/* Version 2: collision-free, mobile-friendly compact nodes */
.timeline-wrap {min-width:0; padding:20px 24px 25px;}
.section {margin-bottom:16px; border-bottom:1px solid #edf0f5;}
.section-title {top:8px; font-size:15px;}
.section-sub {display:none !important;}
.axis {top:72px; height:11px; background:#d8dce3;}
.node {width:36px;height:36px;font-size:10px;top:60px;border:3px solid white;box-shadow:0 3px 10px #0002;}
.task-group {position:absolute;width:194px;display:flex;flex-direction:column;gap:6px;z-index:7;}
.task-card {cursor:pointer;min-height:48px;background:#fff;padding:5px 8px;border:1px solid #dce3ec;border-radius:8px;box-shadow:0 2px 8px #00000009;white-space:normal;overflow-wrap:anywhere;}
.task-card:hover,.task-card:focus {border-color:#3386ee;background:#f2f7ff;outline:none;}
.task-name {font-weight:650;font-size:12px;line-height:1.4;}
.task-meta {color:#6b7280;font-size:11px;margin-top:2px;}
.pending-box {bottom:4px;left:255px;max-width:1900px;}
.months {height:54px;}
.month-label {font-size:13px;white-space:nowrap;}
.month-line {top:24px;background:#e4e8ee;}
@media(max-width:700px){
 .app {display:flex;flex-direction:column;padding:8px;gap:10px;}
 .board,.side {border-radius:12px;}
 .board {width:100%;}
 .toolbar{padding:10px;gap:6px;}
 .toolbar h1{font-size:16px;width:100%;}
 .toolbar button,.toolbar label.btn{font-size:12px;padding:7px 9px;}
 .toolbar .hint{width:100%;font-size:11px;}
 .side {padding:12px;}
 .timeline-wrap {padding-top:12px;}
}


.range-control{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#334155;white-space:nowrap}
.range-control input{width:100px;accent-color:#2563eb}
.range-control b{min-width:34px;font-size:11px;font-weight:600}
.timeline-task-card{position:absolute;min-height:50px;z-index:6;box-shadow:none}
.card-stem{position:absolute;width:1px;border-left:1.5px dashed #93c5fd;z-index:4;pointer-events:none}
.section-title{width:250px;line-height:1.4}
.section{overflow:visible}
#timelineWrap{transform-origin:left top}
@media(max-width:700px){.range-control input{width:73px}.toolbar .hint{order:10}.range-control{font-size:11px}}

/* V4 toolbar and resizable sidebar */
:root{--left-size:255px;--ui-font:12px}
body{padding-top:0}
.app{grid-template-columns:minmax(0,1fr) 330px;padding-top:116px}
.board{overflow:auto;min-width:0;}
.toolbar{position:fixed!important;top:0!important;left:0;right:0;z-index:200!important;display:block!important;padding:8px 14px!important;border-radius:0;box-shadow:0 3px 16px #00000012}
.toolbar-primary,.toolbar-secondary{display:flex;gap:7px;align-items:center;flex-wrap:nowrap;min-height:42px;overflow-x:auto}
.toolbar-primary{border-bottom:1px solid #eef0f5;padding-bottom:5px}
.toolbar-secondary{padding-top:5px}
.toolbar-primary h1{font-size:16px;white-space:nowrap;min-width:max-content;margin-right:8px}
.toolbar-primary button,.toolbar-primary .btn,.toolbar-secondary button{white-space:nowrap;flex:0 0 auto}
.toolbar-secondary .hint{flex:1 1 250px;max-width:440px;font-size:11px!important;line-height:1.35}
.range-control{flex:0 0 auto}
.range-control input{width:83px}
.section-title{display:none!important}
.axis{left:var(--left-size)!important}
.pending-box{left:var(--left-size)!important}
.timeline-task-card{font-size:var(--ui-font)}
.task-name{font-size:var(--ui-font)!important;overflow-wrap:anywhere;white-space:normal}
.task-meta{font-size:calc(var(--ui-font) - 1px)!important;white-space:normal}
.section{overflow:visible}
.timeline-wrap{min-width:0;transform-origin:left top}
#leftRail{position:absolute;top:0;left:0;width:var(--left-size);z-index:10;background:#fff;border-right:1px solid #e5e7eb;box-sizing:border-box}
.rail-row{position:relative;display:flex;align-items:flex-start;padding:13px 13px 8px 10px;border-bottom:1px solid #f0f2f5;overflow-wrap:anywhere;font-size:15px;font-weight:700}
#leftResize{position:absolute;right:-5px;top:0;bottom:0;width:10px;cursor:col-resize;z-index:15}
#leftResize:hover,#leftResize.dragging{background:#bfdbfe88}
#leftResize:hover:after{content:'↔';position:absolute;top:15px;left:-10px;color:#2563eb;background:white;border:1px solid #93c5fd;border-radius:8px;padding:3px 5px}
body.editor-collapsed .app{grid-template-columns:minmax(0,1fr)}
body.editor-collapsed .side{display:none}
.side{top:128px;height:calc(100vh - 144px)}
.cross-svg{z-index:5!important;overflow:visible}
.section .node{z-index:7}
body.highlighted .related-node{box-shadow:0 0 0 5px #fff0ab,0 0 14px 7px #ffc84d99!important;border-color:#f9bf46!important;font-weight:800;filter:saturate(1.45)}
body.highlighted .related-card{border:2px solid #eeb936!important;background:#fff6ca!important;box-shadow:0 0 0 3px #fff4ae,0 0 13px 3px #eab30855!important;font-weight:800}
body.highlighted .related-card .task-name{font-weight:900!important}
body.highlighted .cross-relation{stroke:#e4a81e!important;stroke-width:4!important;filter:drop-shadow(0px 0px 4px #facc15)}
@media(max-width:1200px){.app{grid-template-columns:minmax(0,1fr) 330px!important}.side{position:sticky!important}}
@media(max-width:800px){.app{display:block!important;padding-top:125px!important}.board{width:100%}.side{position:relative!important;top:8px!important;height:auto!important}body.editor-collapsed .side{display:none}.toolbar-secondary .hint{min-width:210px}}


/* V5: fixed single-row toolbar; aligned board/sidebar */
:root{--topbar-h:64px}
body .toolbar{position:fixed!important;top:0!important;left:0!important;right:0!important;display:block!important;padding:8px 12px!important;z-index:999!important;overflow:hidden}
body .toolbar-primary{display:flex!important;flex-wrap:nowrap!important;align-items:center!important;gap:8px!important;overflow-x:auto!important;border:0!important;min-height:46px;scrollbar-width:thin}
body .toolbar-primary h1{font-size:15px!important;margin-right:8px;flex:none}
body .toolbar-primary .hint{font-size:11px!important;color:#6b7280!important;flex:none;max-width:350px;line-height:1.3}
body .toolbar-primary .range-control{flex:none;display:flex;align-items:center;gap:3px;white-space:nowrap;font-size:11px}
body .toolbar-primary .range-control input{width:65px}
body .toolbar-primary button,body .toolbar-primary .btn{padding:7px 9px;font-size:12px;flex:none}
body #cloudStatus{font-size:11px;color:#64748b;white-space:nowrap}
body .app{display:grid!important;grid-template-columns:minmax(0,1fr) 330px!important;gap:12px!important;align-items:start!important;padding:calc(var(--topbar-h) + 10px) 12px 12px!important}
body .board{min-width:0!important;align-self:start!important;margin:0!important}
body .side{position:sticky!important;top:calc(var(--topbar-h) + 10px)!important;align-self:start!important;margin:0!important;height:calc(100vh - var(--topbar-h) - 22px)!important;overflow:visible!important;padding-top:18px!important}
body .side> :not(#edgeToggle){position:relative}
#edgeToggle{position:absolute;z-index:999;left:-18px;top:35%;transform:translateY(-50%);width:23px;height:62px;border:1px solid #cbd5e1;border-radius:10px 0 0 10px;background:white;box-shadow:-3px 0 7px #0001;color:#334155;font-size:16px;cursor:pointer;padding:0}
#edgeToggle:hover{background:#eaf2ff}
body.editor-collapsed .app{grid-template-columns:minmax(0,1fr) 0!important;gap:0!important}
body.editor-collapsed .side{display:block!important;width:0!important;padding:0!important;border:0!important;box-shadow:none!important;overflow:visible!important}
body.editor-collapsed .side>:not(#edgeToggle){display:none!important}
body.editor-collapsed #edgeToggle{left:-24px;top:70px;border-radius:10px 0 0 10px}
/* cross-line paths stay visible beneath labels, never occluded by cards */
body .cross-svg{z-index:11!important;pointer-events:none!important;overflow:visible!important}
body .section .node{z-index:15!important}
body .timeline-task-card{z-index:12!important;position:absolute}
body.highlighted .cross-relation{stroke:#dca10b!important;stroke-width:5!important;stroke-dasharray:7 6!important;opacity:1!important;filter:drop-shadow(0 0 3px #ffcc25) drop-shadow(0 0 4px #facc15)!important}
body .cross-relation{opacity:.75}
body.highlighted .related-card{border-color:#e7ac17!important;background:#fff6d5!important;box-shadow:0 0 0 2px #ffec9b,0 0 12px #ffca3280!important}
/* Overlay creates the connector over cards, with glow; dashed leaders remain unobtrusive. */
@media(max-width:850px){body .app{grid-template-columns:minmax(0,1fr)!important}body .side{position:fixed!important;right:0;top:var(--topbar-h)!important;bottom:0;height:auto!important;width:min(340px,92vw)!important;z-index:500;box-shadow:-8px 0 30px #0002}body.editor-collapsed .side{width:0!important}body .toolbar-primary{overflow-x:auto!important}}
/* cloud setup popup */
#cloudDialog{position:fixed;z-index:2000;inset:0;background:#15213a88;display:none;align-items:center;justify-content:center;padding:14px}
#cloudDialog.open{display:flex}
#cloudDialog .dialog-panel{width:min(530px,100%);max-height:88vh;overflow:auto;background:white;border-radius:16px;padding:20px;box-shadow:0 25px 60px #0003}
#cloudDialog textarea{width:100%;min-height:132px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font:12px monospace;resize:vertical}
#cloudDialog button{cursor:pointer;padding:9px 12px;border-radius:8px;border:0;background:#111827;color:white;margin:5px 5px 5px 0}
#cloudDialog button.light{background:#e2e8f0;color:#1e293b}
#cloudDialog p{font-size:13px;line-height:1.55;color:#475569}
#onlineCount{position:fixed;bottom:13px;right:17px;padding:9px 13px;border-radius:999px;background:#17345e;color:white;font-size:12px;z-index:850;box-shadow:0 4px 16px #0003;display:none}

/* V6: single primary row and subtitle */
body .toolbar{overflow:visible!important;padding-bottom:4px!important}
body .toolbar-primary{width:100%;overflow-x:auto!important;min-height:42px;gap:6px!important}
.toolbar-subtitle{padding:5px 4px 4px;font-size:12px;color:#667085;line-height:1.4;white-space:normal}
body .app{padding-top:112px!important}
.timeline-task-card{box-sizing:border-box;min-height:48px;overflow-wrap:anywhere;touch-action:none;cursor:grab}
.timeline-task-card.dragging{cursor:grabbing;opacity:.90;z-index:60!important}
.timeline-task-card .resize-corner{position:absolute;width:12px;height:12px;background:#fff;border:2px solid #3b82f6;border-radius:4px;z-index:10;opacity:0;touch-action:none}
.timeline-task-card:hover .resize-corner,.timeline-task-card.manual-selected .resize-corner{opacity:1}
.resize-corner.nw{left:-6px;top:-6px;cursor:nwse-resize}.resize-corner.ne{right:-6px;top:-6px;cursor:nesw-resize}.resize-corner.sw{left:-6px;bottom:-6px;cursor:nesw-resize}.resize-corner.se{right:-6px;bottom:-6px;cursor:nwse-resize}
.timeline-task-card{height:auto}
.timeline-task-card .task-name{overflow-wrap:anywhere}
.timeline-task-card.manual-selected,.section .node.manual-selected{outline:3px solid #f2b414!important;box-shadow:0 0 0 6px #fff1a1,0 0 20px #fbbf2477!important;background:#fff7d1!important;color:#111827!important;z-index:90!important}
.section .node.manual-selected{background:#f59e0b!important;color:white!important}
.relation-panel{padding:12px;border:1px solid #f8d37e;background:#fffaf0;border-radius:12px;margin:12px 0}
.relation-panel h3{margin:0 0 7px;font-size:15px}.relation-panel p{font-size:12px;color:#735c38;line-height:1.5}
.relation-tags{display:flex;flex-wrap:wrap;gap:5px;font-size:12px}.relation-tags span{padding:4px 6px;border-radius:7px;background:#ffedaf}
body.highlighted .explicit-related{box-shadow:0 0 0 5px #fff0ab,0 0 16px #facc1588!important;border-color:#eab308!important}
.cross-svg{pointer-events:none!important}

/* V7: side panel as separate swapping pages, independent scrolling and smooth rendering */
body .side{overflow:hidden!important;display:flex!important;flex-direction:column!important;min-height:0!important;contain:layout style}
body.editor-collapsed .side{overflow:visible!important}
body .side-page{display:none;min-height:0;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;scroll-behavior:auto;padding:2px 6px 18px 2px;transform:translateX(16px);opacity:0;transition:transform .20s ease,opacity .20s ease;will-change:transform,opacity}
body .side-page.active-side-page{display:block;transform:translateX(0);opacity:1;animation:arhkSwap .23s ease-out}
@keyframes arhkSwap{from{opacity:.2;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
body .relation-panel{margin:0!important;padding:12px!important;border:none!important;background:#fffaf3!important}
.relation-page-header{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.relation-page-header h3{margin:0;font-size:17px}
#relateModeBtn.mode-active{background:#fff1a8!important;color:#7c5200!important;border:1px solid #efbe38!important}
.section .node.manual-selected{position:absolute;z-index:100!important;outline:3px solid #fff4aa!important;box-shadow:0 0 0 6px #facb34,0 0 22px 8px #facc15aa!important;background:#edaa00!important;color:white!important}
.timeline-task-card.manual-selected{z-index:99!important}
/* scrolling: don't promote hundreds of static cards to composite layers */
body .timeline-task-card:not(.dragging){will-change:auto!important}
body .board{overscroll-behavior:contain;scroll-behavior:auto; -webkit-overflow-scrolling:touch}
@media(prefers-reduced-motion:reduce){body .side-page{transition:none!important;animation:none!important}}

/* V8: tidy control groups, smooth scrolling and visible relationship anchors */
html,body{overflow-y:auto!important;overscroll-behavior-y:auto!important;scroll-behavior:auto!important}
body .board{overscroll-behavior-y:auto!important;overflow-y:visible!important;overflow-x:auto!important}
body .app{align-items:start}
.toolbar-primary{justify-content:space-between;overflow-x:auto!important;gap:10px!important}
.toolbar-group{display:flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid #e8edf6;border-radius:12px;background:#f8fafc;flex:none}
.toolbar-group.node-tools{margin-left:auto;background:#edf4ff;border-color:#d7e5fb}
.group-title{font-size:11px;color:#64748b;font-weight:700;margin-right:2px}
.toolbar-primary h1{font-size:15px!important;margin-right:8px!important}
body .cross-svg{z-index:9!important;pointer-events:none!important}
body .section .node,body .timeline-task-card{z-index:12!important}
.task-connector{fill:none;stroke:#7bb6f5;stroke-width:1.8;stroke-dasharray:4 4;pointer-events:none}
.task-connector.explicit-connector{stroke:#d7a10b;stroke-width:3}
body.highlighted .task-connector.explicit-connector{stroke:#e2a800;stroke-width:4;filter:drop-shadow(0 0 3px #ffcc25)}
body.highlighted .explicit-related{outline:3px solid #f0bc2d!important;box-shadow:0 0 0 6px #fff1a5,0 0 17px 6px #f7ba3388!important;background:#fff4cb!important;font-weight:800!important}
body.highlighted .node.explicit-related{background:#d99a05!important;color:white!important}
body .timeline-task-card{cursor:grab}
body .side-page{overscroll-behavior-y:auto!important}


/* V9: Apple-inspired single-layer toolbar + stable viewport editor */
:root { --topbar-h: 94px; --v9-gap:12px; }
html { overflow-x:hidden!important; }
body {margin:0!important; background:#f5f5f7!important; overflow-x:hidden!important; color:#1d1d1f!important;}
body .toolbar { position:fixed!important; top:0!important; left:0!important; right:0!important; width:100%!important; z-index:9999!important; box-sizing:border-box!important; overflow:visible!important; background:rgba(255,255,255,.96)!important; border:0!important; border-bottom:1px solid #e5e5ea!important; box-shadow:0 2px 14px rgba(0,0,0,.035)!important; padding:10px 16px 8px!important; backdrop-filter:blur(18px)!important; -webkit-backdrop-filter:blur(18px)!important;}
body .toolbar-primary { display:flex!important; flex-wrap:wrap!important; align-items:center!important; justify-content:flex-start!important; width:100%!important; height:auto!important; min-height:36px!important; overflow-x:visible!important; overflow-y:visible!important; gap:7px 10px!important; scrollbar-width:none!important; }
body .toolbar-primary h1 {font-size:17px!important; font-weight:700!important; letter-spacing:-.45px!important; padding:0 12px 0 0!important; margin:0!important; color:#1d1d1f!important;}

function drawCardConnectors(){
 const root=timelineWrap.getBoundingClientRect();
 const sx=timelineWrap.offsetWidth/root.width || 1;
 const sy=timelineWrap.offsetHeight/root.height || 1;
 const toPt=(x,y)=>({x:(x-root.left)*sx,y:(y-root.top)*sy});
 const groupOf=(line,id)=>extras.groups.some(g=>g.includes(nodeKey(line,id)));
 document.querySelectorAll('.section').forEach(sec=>{
   const circles=[...sec.querySelectorAll('.node')];
   for(const card of sec.querySelectorAll('.timeline-task-card')){
     const item=findItem(card.dataset.line,card.dataset.id)?.item;
     if(!item?.date) continue;
     const circle=circles.find(c=>findItem(c.dataset.line,c.dataset.id)?.item?.date===item.date);
     if(!circle)continue;
     const a=circle.getBoundingClientRect(), b=card.getBoundingClientRect();
     const cx=(a.left+a.right)/2,cy=(a.top+a.bottom)/2;
     let tx=Math.max(b.left,Math.min(b.right,cx));
     let ty=Math.max(b.top,Math.min(b.bottom,cy));
     if(cx>=b.left && cx<=b.right){
       if(cy<=b.top){ty=b.top;tx=cx}
       else if(cy>=b.bottom){ty=b.bottom;tx=cx}
       else{
         const edges=[{d:cy-b.top,x:cx,y:b.top},{d:b.bottom-cy,x:cx,y:b.bottom},{d:cx-b.left,x:b.left,y:cy},{d:b.right-cx,x:b.right,y:cy}];
         edges.sort((p,q)=>p.d-q.d);tx=edges[0].x;ty=edges[0].y;
       }
     }
     const dx=tx-cx,dy=ty-cy;
     const length=Math.hypot(dx,dy)||1;
     const r=Math.min(a.width,a.height)/2;
     const p1=toPt(cx+dx/length*r,cy+dy/length*r),p2=toPt(tx,ty);
     const path=document.createElementNS('http://www.w3.org/2000/svg','path');
     path.setAttribute('d',`M${p1.x.toFixed(2)},${p1.y.toFixed(2)} L${p2.x.toFixed(2)},${p2.y.toFixed(2)}`);
     path.setAttribute('class','task-connector');
     if(groupOf(card.dataset.line,card.dataset.id))path.classList.add('explicit-connector');
     crossSvg.appendChild(path);
   }
 });
}

  };
  // remove old
  if(cur.type==='node') cur.line.nodes = cur.line.nodes.filter(n=>n.id!==cur.item.id); else cur.line.pending = cur.line.pending.filter(n=>n.id!==cur.item.id);
  const saveAsNode = !!updated.date;
  if(saveAsNode) targetLine.nodes.push(updated); else { delete updated.date; (targetLine.pending ||= []).push(updated); }
  selected = {lineId:newLineId, id:updated.id, type: saveAsNode?'node':'pending'};
  saveState(); render(); selectNode(selected.lineId, selected.id, selected.type==='pending');
}
function duplicateCurrent(){
  if(!selected) return;
  const cur = findItem(selected.lineId, selected.id); if(!cur) return;
  const copy = JSON.parse(JSON.stringify(cur.item));
  copy.id = copy.id + '_copy';
  copy.title = copy.title + '（副本）';
  if(cur.type==='node') cur.line.nodes.push(copy); else cur.line.pending.push(copy);
  saveState(); render(); selectNode(cur.line.id, copy.id, cur.type==='pending');
}
function deleteCurrent(){

}

function xmlEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function wrapSvgText(text,maxChars=16){
 const out=[];let str=String(text||'');while(str.length){out.push(str.slice(0,maxChars));str=str.slice(maxChars);}return out.length?out:[''];
}
function buildExportSvg(){
 const exportFont=Number(document.getElementById("fontRange").value)||12;const viewW=timelineWrap.offsetWidth;const sections=[...document.querySelectorAll('.section')];
 const totalH=80+sections.reduce((a,s)=>a+s.offsetHeight+16,0)+30;
 const arr=[`<svg xmlns="http://www.w3.org/2000/svg" width="${viewW}" height="${totalH}" viewBox="0 0 ${viewW} ${totalH}">`,
 `<rect width="100%" height="100%" fill="#fff"/>`,
 `<text x="24" y="32" font-size="20" font-weight="700" fill="#111827">欧晟项目五线时间节点图</text>`];
 const dates=[...new Set(getDatedNodes().map(x=>x.node.date))].sort();const left=Number(document.documentElement.style.getPropertyValue("--left-size").replace("px", ""))||255,col=Number(document.getElementById('spacingRange').value);const xs={};dates.forEach((d,i)=>xs[d]=left+55+i*col);
 let y=65;
 for(const sec of sections){
 const id=sec.dataset.line, data=state.lines.find(l=>l.id===id),height=sec.offsetHeight;
 arr.push(`<text x="22" y="${y+26}" font-size="18" font-weight="700" fill="#111827">${xmlEsc(data.name)}</text>`);
 arr.push(`<line x1="255" y1="${y+82}" x2="${viewW-25}" y2="${y+82}" stroke="#d1d5db" stroke-width="8" stroke-linecap="round"/>`);
 const cards=[...sec.querySelectorAll('.timeline-task-card')];
 for(const node of [...sec.querySelectorAll('.node')]){
 const f=findItem(id,node.dataset.id), n=f?.item;if(!n)continue;
 const x=xs[n.date];const color=n.status==='已完成'?'#27AE60':n.status==='进行中'?'#2F80ED':n.status==='待确认'?'#e0a800':'#7f8a98';
 arr.push(`<circle cx="${x}" cy="${y+78}" r="18" fill="${color}" stroke="#fff" stroke-width="3"/>`);
 arr.push(`<text x="${x}" y="${y+81}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${xmlEsc(fmtDate(n.date))}</text>`);
 }
 for(const card of cards){
 const cx=Number.parseFloat(card.style.left),cy=Number.parseFloat(card.style.top),w=156;
 const title=card.querySelector('.task-name').textContent;
 const meta=card.querySelector('.task-meta').textContent;
 const lines=wrapSvgText(title,14);
 const cardH=Math.max(50,10+lines.length*17+17);
 arr.push(`<line x1="${cx+w/2}" y1="${y+96}" x2="${cx+w/2}" y2="${y+cy}" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 4"/>`);
 arr.push(`<rect x="${cx}" y="${y+cy}" width="${w}" height="${cardH}" rx="7" fill="#fff" stroke="#dce3ec"/>`);
 lines.forEach((line,i)=>arr.push(`<text x="${cx+8}" y="${y+cy+17+i*17}" font-size="${exportFont+4}" font-weight="600" fill="#111827">${xmlEsc(line)}</text>`));
 arr.push(`<text x="${cx+8}" y="${y+cy+17+lines.length*17}" font-size="${exportFont+2}" fill="#6b7280">${xmlEsc(meta)}</text>`);
 }
 const pending=data.pending||[];
 if(pending.length){arr.push(`<text x="255" y="${y+height-14}" font-size="11" fill="#946200">日期待定：${xmlEsc(pending.map(p=>p.id+' '+p.title).join('  ｜  '))}</text>`)}
 y+=height+16;
 }
 // Same-date connections. Date represents matching scheduled completion, not causal dependence.
 for(const date of dates){const idx=state.lines.map((l,i)=>l.nodes.some(n=>n.date===date)?i:-1).filter(i=>i>=0);if(idx.length<2)continue;
 let curr=65;const ys=[];for(let i=0;i<sections.length;i++){ys[i]=curr+78;curr+=sections[i].offsetHeight+16;}
 arr.push(`<line x1="${xs[date]}" y1="${ys[idx[0]]}" x2="${xs[date]}" y2="${ys[idx[idx.length-1]]}" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 6" opacity=".75"/>`);
 }
 arr.push('</svg>');return {svg:arr.join(''),w:viewW,h:totalH};
}
function saveBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function exportPng(){
 try{
 const {svg,w,h}=buildExportSvg(); const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob),img=new Image();
 await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});
 const canvas=document.createElement('canvas');const factor=Math.min(2,16000/Math.max(w,h));canvas.width=Math.ceil(w*factor);canvas.height=Math.ceil(h*factor);
 const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.scale(factor,factor);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);
 canvas.toBlob(b=>b?saveBlob(b,'欧晟项目五线时间轴.png'):alert('PNG生成失败'),'image/png');
 }catch(e){alert('PNG导出失败：'+e.message)}
}
function exportPdf(){
 // The print document snapshots the ACTUAL rendered timeline, including current
 // card coordinates, custom sizes, fonts, node highlights and SVG connection paths.
 // No reconstruction: the printed state comes directly from this DOM.
 const board = document.getElementById('timelineWrap');
 const clone = board.cloneNode(true);
 // Serialize SVG DOM as markup and preserve selected/highlight classes on body.
 const allStyles=[...document.querySelectorAll('style')].map(el=>el.textContent).join('\n');
 const printWindow=window.open('','_blank');
 if(!printWindow){ alert('请允许弹出窗口，以便导出当前页面为PDF。'); return; }
 const printCss=`
 @page{size:A2 landscape;margin:10mm}
 html,body{margin:0!important;padding:0!important;background:white!important;color:#242424!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 body{overflow:visible!important;min-width:0!important}
 .timeline-wrap{position:relative!important;display:block!important;transform:none!important;overflow:visible!important;margin:0!important;max-width:none!important;}
 .timeline-wrap *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 .cross-svg{overflow:visible!important;}
 .toolbar,.side,.app,.board{position:static!important}
 `;
 printWindow.document.open();
 printWindow.document.write('<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>ARHK Timeline · 当前视图 PDF</title><style>'+allStyles+'\n'+printCss+'</style></head><body class="'+document.body.className.replace(/"/g,'')+'">'+clone.outerHTML+'</body></html>');
 printWindow.document.close();
 const run=()=>{ printWindow.focus();setTimeout(()=>printWindow.print(),450); };
 if(printWindow.document.readyState==='complete') run();else printWindow.addEventListener('load',run,{once:true});
}
